<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: TV yarışma stüdyosu — üstte oyuncu kürsüleri (kasa + kazanılan fotoğraflar), ortada spot ışığı altındaki eşya fotoğrafı, yanında teklif paneli. */
:root{
  --bg:#eef1f7; --panel:#ffffff; --panel2:#e3e8f2; --ink:#141a2e; --muted:#58607d; --line:#d2d8e6;
  --money:#0d8659; --paddle:#e8482a; --spot:#f2b51c; --shade:rgba(20,26,46,.08);
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f1f; --panel:#161a31; --panel2:#1f2442; --ink:#eef0fa; --muted:#9aa1c4; --line:#2a3052;
  --money:#3ddc97; --paddle:#ff6a45; --spot:#ffd25a; --shade:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f1f; --panel:#161a31; --panel2:#1f2442; --ink:#eef0fa; --muted:#9aa1c4; --line:#2a3052;
  --money:#3ddc97; --paddle:#ff6a45; --spot:#ffd25a; --shade:rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1;letter-spacing:-.02em}
.ticket{font-family:var(--mono);font-size:.62em;background:var(--spot);color:#1b1300;padding:6px 12px 5px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 3px 0 var(--ink)}
.tag{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0;line-height:1.15}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
input,textarea{font:inherit;font-size:16px;width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:190px;resize:vertical}
.code-in{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;font-size:20px}
:focus-visible{outline:3px solid var(--spot);outline-offset:2px}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:10px;padding:12px 20px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);transition:transform .12s}
button:not(:disabled):active{transform:translateY(1px)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:not(:disabled):hover{border-color:var(--ink)}
button.hot{background:var(--paddle);border-color:var(--paddle);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--paddle) 60%,#000)}
button:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--paddle);font-weight:700;font-size:14px;margin:0}
.bigcode{font-family:var(--mono);font-size:clamp(40px,10vw,62px);letter-spacing:.22em;color:var(--spot);line-height:1}
/* fotoğraf */
.ph{position:relative;overflow:hidden;background:var(--panel2);border-radius:10px;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;text-align:center;padding:8px;line-height:1}
.ph.mem .fb{display:flex;flex-direction:column;justify-content:center;gap:.15em;container-type:inline-size;text-shadow:0 2px 10px rgba(80,0,30,.35)}
.ph.mem .heart{font-size:max(12px,28cqi);line-height:1}
.ph.mem .ms{font-size:max(8px,13cqi);line-height:1.05;overflow-wrap:anywhere}
.lot .ph.mem .heart{font-size:clamp(60px,14vw,120px)} .lot .ph.mem .ms{font-size:clamp(20px,4vw,34px)}
.lot .ph.mem .fb{padding-bottom:28%}
.mini .ph.mem .ms{display:none} .mini .ph.mem .heart{font-size:14px}
.th.special{border-color:#e0457b;background:linear-gradient(160deg,color-mix(in srgb,#e0457b 16%,var(--panel)),var(--panel))}
.th.special .nm::before{content:"Özel mod · ";color:#e0457b}
/* ana sayfa */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.collage{position:relative;min-height:300px;border-radius:14px;background:var(--panel2);overflow:hidden}
.collage .ph{position:absolute;width:40%;aspect-ratio:4/5;border:4px solid var(--panel);box-shadow:0 10px 24px var(--shade)}
.collage .price{position:absolute;font-family:var(--mono);background:var(--money);color:#fff;padding:3px 8px;border-radius:6px;font-size:14px;bottom:8px;left:8px}
.collage .claim{position:absolute;left:16px;bottom:14px;right:16px;font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,32px);line-height:1.05;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.split{grid-template-columns:1fr}}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rule{display:flex;gap:12px;align-items:flex-start}
.rule .n{font-family:var(--mono);background:var(--spot);color:#1b1300;border-radius:8px;min-width:34px;height:34px;display:grid;place-items:center;font-size:14px}
.rule p{margin:2px 0 0;color:var(--muted);font-size:14px}
/* tema seçimi */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.th{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;font-weight:700;min-width:0}
.th .mosaic{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:8px;overflow:hidden;aspect-ratio:1}
.th .mosaic .ph{border-radius:0;aspect-ratio:1}
.th .nm{font-family:var(--display);font-size:16px;line-height:1.15;padding:0 4px 4px}
.th.sel{border-color:var(--spot);box-shadow:0 0 0 3px color-mix(in srgb,var(--spot) 40%,transparent)}
button.th:disabled{opacity:1;cursor:default}
.th.custom .mosaic{display:grid;place-items:center;grid-template-columns:1fr;background:var(--panel2);font-family:var(--display);font-size:44px;color:var(--muted)}
/* kürsüler */
.podiums{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pod{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pod.me{border:2px solid var(--money)}
.pod .top{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.pod .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cash{font-family:var(--mono);font-size:24px;color:var(--money);font-variant-numeric:tabular-nums;line-height:1}
.meter{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--money)}
.st{font-size:12px;color:var(--muted);font-weight:700}
.st.ok{color:var(--money)}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini .ph{width:28px;height:28px;border-radius:6px}
.mini .ph .fb{font-size:11px;padding:0}
/* sahne */
.stage{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.lot{position:relative;border-radius:16px;overflow:hidden;background:var(--panel2);aspect-ratio:4/3;max-width:100%;box-shadow:0 14px 40px var(--shade)}
.lot .ph{position:absolute;inset:0;border-radius:0}
.lot .ph .fb{font-size:clamp(44px,10vw,90px)}
.lot .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;background:linear-gradient(transparent,rgba(5,7,16,.88));color:#fff}
.lot .no{font-family:var(--mono);font-size:12px;letter-spacing:.08em;opacity:.85}
.lot .item{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.5vw,50px);line-height:1;text-wrap:balance;overflow-wrap:anywhere}
.lot .credit{position:absolute;top:10px;right:10px;font-size:11px;background:rgba(5,7,16,.6);color:#fff;padding:3px 8px;border-radius:6px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.stamp{position:absolute;top:22px;left:18px;font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,40px);color:#fff;background:var(--paddle);padding:4px 16px;border-radius:8px;transform:rotate(-7deg);box-shadow:0 6px 0 rgba(0,0,0,.25);animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
.stamp.burn{background:#444a63}
@keyframes slam{from{transform:rotate(-7deg) scale(2.2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{flex:1;min-width:14px;height:6px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--money)} .dots i.now{background:var(--spot)}
.panel{display:flex;flex-direction:column;gap:14px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px}
.stepper button{height:56px;padding:0;font-size:28px;border-radius:12px}
.amount{font-family:var(--mono);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;color:var(--money);line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:7px 13px;font-family:var(--mono);font-size:14px;background:var(--panel2);color:var(--ink);border:0;border-radius:8px}
.chips button.on{background:var(--ink);color:var(--bg)}
.bidrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);align-items:center;min-width:0}
.bidrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.bidrow.win{background:var(--money);color:#fff}
.bidrow b{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* sonuç */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.team.top{border:3px solid var(--spot)}
.team .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.team .it{display:flex;flex-direction:column;gap:3px;min-width:0}
.team .it .ph{aspect-ratio:1}
.team .it span{font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .it b{font-family:var(--mono);font-size:12px;color:var(--money)}
.votes{font-family:var(--mono);color:var(--spot);font-size:18px}
.judge{border-left:4px solid var(--spot);padding:12px 14px;background:var(--panel2);border-radius:0 10px 10px 0;white-space:pre-wrap}
details.credits{font-size:12px;color:var(--muted)}
details.credits summary{cursor:pointer;font-weight:700}
details.credits ul{columns:2 260px;padding-left:18px}
details.credits a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const BUDGET=20, ITEMS=10, MINI=5, MAXP=8;
function N(g){return (g.items&&g.items.length)||ITEMS}
const THEMES=DATA.themes, CREDITS=DATA.credits;

// ---------- yardımcılar ----------
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let store=null;try{store=window.localStorage}catch(e){}
const ls={get(k){try{return store&&store.getItem(k)}catch(e){return null}},set(k,v){try{store&&store.setItem(k,v)}catch(e){}}};
function initials(s){return String(s).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function hue(s){return hash(String(s))%360}
// eşya: {t, img} — eski odalarda düz metin olabilir
function it(x){return typeof x==="string"?{t:x,img:null}:x}
function photo(x,cls=""){
  x=it(x);const c=x.img&&CREDITS[x.img];
  if(c)return `<div class="ph ${cls}"><img src="img/${esc(c.file)}" alt="${esc(x.t)}" loading="lazy" decoding="async"></div>`;
  if(x.s){const h=330+hash(x.t)%40;
    return `<div class="ph mem ${cls}" style="background:radial-gradient(circle at 30% 25%,hsl(${h%360} 85% 72%),hsl(${(h+20)%360} 65% 42%) 70%)"><div class="fb"><span class="heart">♥</span><span class="ms">${esc(x.s)}</span></div></div>`}
  const h=hue(x.t);
  return `<div class="ph ${cls}" style="background:linear-gradient(135deg,hsl(${h} 70% 45%),hsl(${(h+50)%360} 75% 30%))"><div class="fb">${esc(initials(x.t))}</div></div>`;
}
function avatar(g,id){const n=pname(g,id),h=hue(id);return `<span class="av" style="background:hsl(${h} 60% 42%)">${esc(initials(n)||"?")}</span>`}

// ---------- oyun mantığı ----------
function bidsOf(g,r){return (g.bids&&g.bids[g.gid+"_"+r])||{}}
function votesOf(g){return (g.votes&&g.votes[g.gid])||{}}
function roster(g){return g.roster||Object.keys(g.players||{}).sort((a,b)=>g.players[a].order-g.players[b].order)}
function pname(g,id){return (g.players&&g.players[id]&&g.players[id].name)||"Oyuncu"}
function ledger(g,upto){
  const R=roster(g),cash={},won={};
  R.forEach(id=>{cash[id]=BUDGET;won[id]=[]});
  for(let r=0;r<upto;r++){const res=resolve(g,r,cash);if(res.winner){cash[res.winner]-=res.price;won[res.winner].push({item:it(g.items[r]),price:res.price})}}
  return {cash,won};
}
function bidsIn(g,r,cash){const b=bidsOf(g,r);return roster(g).every(id=>b[id]!=null||cash[id]<=0)}
function resolve(g,r,cash){
  const b=bidsOf(g,r);let best=null;
  roster(g).forEach(id=>{const a=Math.min(Number(b[id])||0,cash[id]);if(a<1)return;
    const k=[a,cash[id],hash(g.code+":"+r+":"+id)];
    if(!best||k[0]>best.k[0]||(k[0]===best.k[0]&&(k[1]>best.k[1]||(k[1]===best.k[1]&&k[2]>best.k[2]))))best={id,k}});
  return {winner:best?best.id:null,price:best?best.k[0]:0};
}
function voteTally(g){const t={};roster(g).forEach(id=>t[id]=0);const V=votesOf(g);for(const v in V){if(V[v] in t)t[V[v]]++}return t}

const S={mode:null,code:null,myId:null,g:null,db:null,sample:null,unsub:null,err:"",busy:false,stale:false,timer:null,bid:0,judging:false,customOpen:false};
// ---------- PeerJS aktarımı (GitHub sürümü) ----------
// Ev sahibinin tarayıcısı oyunun durumunu tutar; diğerleri ona bağlanır.
const PREFIX="mezat20-v1-";
function deepMerge(t,p){for(const k in p){if(p[k]&&typeof p[k]==="object"&&!Array.isArray(p[k])){t[k]=t[k]||{};deepMerge(t[k],p[k])}else t[k]=p[k]}}
function pid(){let v=ls.get("m20-pid");if(!v){v="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);ls.set("m20-pid",v)}return v}
const P={peer:null,conns:[],host:null,isHost:false,retry:0};
function broadcast(){if(!P.isHost)return;const msg={type:"state",g:S.g};P.conns.forEach(c=>{try{c.open&&c.send(msg)}catch(e){}});
  try{ls.set("m20-host-"+S.code,JSON.stringify(S.g))}catch(e){}}
function hostApply(from,patch){
  // istemcinin yazabileceği alanları sınırla
  const g=S.g,ok={};
  if(patch.players&&patch.players[from]&&!g.players[from]){
    if(g.status==="lobby"&&Object.keys(g.players).length<MAXP)ok.players={[from]:{name:String(patch.players[from].name||"Oyuncu").slice(0,18),order:Date.now()}};
  }
  if(patch.bids){for(const k in patch.bids){const v=patch.bids[k]&&patch.bids[k][from];if(v!=null&&k===g.gid+"_"+g.idx){ok.bids={[k]:{[from]:Math.max(0,Math.min(BUDGET,v|0))}}}}}
  if(patch.votes&&patch.votes[g.gid]&&patch.votes[g.gid][from]!=null)ok.votes={[g.gid]:{[from]:String(patch.votes[g.gid][from])}};
  deepMerge(g,ok);broadcast();render();
}
function hostOpen(code,g){
  S.mode="online";S.code=code;S.g=g;P.isHost=true;S.busy=true;render();
  const peer=new Peer(PREFIX+code,{debug:0});P.peer=peer;
  peer.on("open",()=>{S.busy=false;S.stale=false;P.retry=0;broadcast();render()});
  peer.on("connection",c=>{
    c.on("open",()=>{P.conns.push(c);c.send({type:"state",g:S.g})});
    c.on("data",m=>{if(m&&m.type==="patch"&&m.from)hostApply(String(m.from),m.patch||{})});
    c.on("close",()=>{P.conns=P.conns.filter(x=>x!==c)});
  });
  peer.on("error",e=>{
    if(e.type==="unavailable-id"&&P.retry<6){P.retry++;S.err="Oda yeniden açılıyor…";render();try{peer.destroy()}catch(x){}setTimeout(()=>{S.err="";hostOpen(code,S.g)},3000);return}
    if(e.type==="unavailable-id"){S.err="Bu oda kodu şu an başka bir sekmede açık.";S.busy=false;render();return}
    if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){S.stale=true;render();return}
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
}
function clientOpen(code,name){
  S.mode="online";S.code=code;S.g=null;P.isHost=false;S.busy=true;render();
  const peer=new Peer(undefined,{debug:0});P.peer=peer;
  let gotState=false;
  const connect=()=>{
    const c=peer.connect(PREFIX+code,{reliable:true});P.host=c;
    c.on("open",()=>{c.send({type:"patch",from:S.myId,patch:{players:{[S.myId]:{name}}}})});
    c.on("data",m=>{if(m&&m.type==="state"){gotState=true;const prev=S.g;S.g=m.g;S.busy=false;S.stale=false;
      if(!prev||prev.idx!==S.g.idx||prev.status!==S.g.status)S.bid=0;ls.set("m20-room",code);ls.set("m20-room-name",name);render()}});
    c.on("close",()=>{if(S.mode!=="online"||S.code!==code)return;S.stale=true;render();setTimeout(()=>{if(S.mode==="online"&&S.code===code&&!P.isHost)connect()},3000)});
  };
  peer.on("open",connect);
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){if(!gotState){S.err="Bu kodla açık bir oda bulunamadı. Ev sahibinin sayfası açık mı?";leave(true)}else{S.stale=true;render()}return}
    S.stale=true;render();
  });
  setTimeout(()=>{if(!gotState&&S.mode==="online"&&S.code===code){S.stale=true;render()}},10000);
}
async function write(patch){
  if(S.mode==="local"){deepMerge(S.g,patch);render();return true}
  if(P.isHost){deepMerge(S.g,patch);broadcast();render();return true}
  try{P.host.send({type:"patch",from:S.myId,patch});return true}catch(e){S.err="Gönderilemedi, bağlantı kuruluyor…";render();return false}
}
function randCode(){const A="ABCDEFGHJKLMNPRSTUVYZ23456789";let s="";for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function nick(){const v=((document.getElementById("nick")||{}).value||ls.get("m20-nick")||"").trim().slice(0,18);return v||"Oyuncu"}
function createRoom(){
  const name=nick();ls.set("m20-nick",name);const code=randCode();
  const g={code,createdAt:Date.now(),host:S.myId,status:"lobby",themeIdx:0,custom:null,players:{[S.myId]:{name,order:Date.now()}},bids:{},votes:{},idx:0};
  ls.set("m20-room",code);hostOpen(code,g);
}
function joinRoom(){
  const code=(document.getElementById("joinCode").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==4){S.err="Oda kodu 4 karakter olmalı.";render();return}
  const name=nick();ls.set("m20-nick",name);S.err="";clientOpen(code,name);
}
function leave(keepErr){
  try{P.peer&&P.peer.destroy()}catch(e){}
  if(P.isHost&&S.code)ls.set("m20-host-"+S.code,"");
  P.peer=null;P.conns=[];P.host=null;P.isHost=false;
  S.mode=null;S.g=null;S.code=null;ls.set("m20-room","");if(!keepErr)S.err="";render();
}

function themeOf(g){if(g.custom)return {name:g.custom.name,items:g.custom.items.map(t=>({t,img:null}))};const T=THEMES[g.themeIdx||0]||THEMES[0];return {name:T.name,items:T.items}}
function startGame(){
  const g=S.g,t=themeOf(g);
  if(t.items.length<MINI){S.err=`Temada en az ${MINI} eşya olmalı.`;render();return}
  const R=Object.keys(g.players).sort((a,b)=>g.players[a].order-g.players[b].order);
  write({status:"bidding",gid:"g"+Date.now().toString(36),roster:R,themeName:t.name,items:shuffle(t.items).slice(0,ITEMS),idx:0,judge:null});
}
function myBidder(){
  if(S.mode==="online")return S.myId;
  const g=S.g,L=ledger(g,g.idx),b=bidsOf(g,g.idx);
  return roster(g).find(id=>b[id]==null&&L.cash[id]>0)||null;
}
function submitBid(){
  const g=S.g,who=myBidder();if(!who||S.busy)return;
  const cash=ledger(g,g.idx).cash[who];const amt=Math.max(0,Math.min(cash,S.bid|0));
  S.bid=0;write({bids:{[g.gid+"_"+g.idx]:{[who]:amt}}});
}
function nextItem(){const g=S.g;if(g.idx+1>=N(g))write({status:"vote",idx:N(g)});else write({idx:g.idx+1})}
function myVoter(){
  const g=S.g,R=roster(g);
  if(S.mode==="online")return R.includes(S.myId)&&!votesOf(g)[S.myId]?S.myId:null;
  return R.find(id=>!votesOf(g)[id])||null;
}
function castVote(to){const who=myVoter();if(!who||S.busy)return;write({votes:{[S.g.gid]:{[who]:to}}})}
async function askJudge(){
  if(!S.sample||S.judging)return;
  const g=S.g,L=ledger(g,N(g)),R=roster(g);
  const teams=R.map(id=>({oyuncu:pname(g,id),takim:L.won[id].map(w=>w.item.t+" ($"+w.price+")"),kalan_para:L.cash[id]}));
  S.judging=true;S.err="";render();
  try{
    const res=await S.sample.json(`Bir "20 dolar mezat" parti oyununda hakemsin. Tema: "${g.themeName}". Her oyuncu 20 dolarla açık artırmada eşya topladı. Temanın en iyi versiyonunu kuran oyuncuyu seç. Eşya sayısını, kalitesini ve temaya uygunluğunu tart; az eşyalı ama çok güçlü bir takım da kazanabilir. Esprili ama adil ol, Türkçe yaz.
Takımlar (JSON): ${JSON.stringify(teams)}
Yalnızca şu JSON'u döndür: {"kazanan":"<oyuncu adı aynen>","yorum":"<3-5 cümle, her takım hakkında kısa yorum ve neden kazandığı>"}`,{modelTier:"default"});
    const winId=R.find(id=>pname(g,id)===res.kazanan)||null;
    await write({judge:{winner:winId,name:String(res.kazanan||"").slice(0,40),text:String(res.yorum||"").slice(0,1500)}});
  }catch(e){S.err=e&&e.code==="not_granted"?"Yapay zeka hakem bu görünümde kullanılamıyor.":e&&e.code==="rate_limited"?"Hakem şu an meşgul, biraz sonra tekrar dene.":"Hakem karar veremedi, tekrar dene."}
  S.judging=false;render();
}
function rematch(){write({status:"lobby",judge:null,idx:0,roster:null,items:null})}
function startLocal(){
  const names=(document.getElementById("localNames").value||"").split(/[\n,]/).map(s=>s.trim()).filter(Boolean).slice(0,MAXP);
  if(names.length<2){S.err="Aynı cihazda oynamak için en az 2 isim yaz (virgülle ayır).";render();return}
  const players={};names.forEach((n,i)=>players["L"+i]={name:n.slice(0,18),order:i});
  S.mode="local";S.err="";S.myId="L0";
  S.g={code:"LOCAL"+Date.now(),host:"L0",status:"lobby",themeIdx:0,custom:null,players,bids:{},votes:{},idx:0};
  render();
}

// ---------- görünüm ----------
const app=document.getElementById("app");
function bind(id,fn){const el=document.getElementById(id);if(el)el.addEventListener("click",fn)}
function errHtml(){return S.err?`<p class="err" role="alert">${esc(S.err)}</p>`:""}
function isHost(){return S.mode==="local"||(S.g&&S.g.host===S.myId)}
function render(){
  document.getElementById("modeTag").textContent=S.mode==="online"?"Oda "+S.code:S.mode==="local"?"Aynı cihaz":"Açık artırma draft · 2-8 oyuncu";
  if(!S.mode)return home();
  const g=S.g;
  if(!g){app.innerHTML=`<div class="card stack"><p class="note">${S.stale?"Odaya ulaşılamıyor, bağlantını kontrol et.":"Oda yükleniyor…"}</p>${errHtml()}<div class="row"><button class="ghost" id="leaveBtn">Ana sayfa</button></div></div>`;bind("leaveBtn",()=>leave());return}
  if(g.status==="lobby")return lobby();
  if(g.status==="bidding")return bidding();
  return results();
}
const HERO=[["efsane",0,"8%","10%",-8,14],["garaj",0,"34%","4%",5,9],["sokak",0,"60%","12%",-4,6],["konsol",1,"14%","46%",6,3],["harika",5,"42%","40%",-6,11],["tatli",0,"64%","50%",8,2]];

  const ok=!!S.db&&!!S.myId;
  const col=HERO.map(([tid,i,l,t,rot,price])=>{const T=THEMES.find(x=>x.id===tid);if(!T)return"";return `<div class="ph" style="left:${l};top:${t};transform:rotate(${rot}deg)">${photo(T.items[i]).replace(/^<div class="ph ">|<\/div>$/g,"")}<span class="price">$${price}</span></div>`}).join("");
  app.innerHTML=`<div class="stack" style="gap:18px">

      <div class="split">
        <div class="stack"><h3>Oda kur</h3><p class="note">Kodu arkadaşına gönder, temayı sen seç.</p><button class="hot" id="createBtn" ${ok&&!S.busy?"":"disabled"}>Oda kur</button></div>
        <div class="stack"><h3>Odaya katıl</h3><input id="joinCode" class="code-in" maxlength="4" placeholder="KOD" autocomplete="off" aria-label="Oda kodu"><button id="joinBtn" class="ghost" ${ok&&!S.busy?"":"disabled"}>Katıl</button></div>
      </div>
      ${ok?"":`<p class="note">${S.db===null?"Online bağlantı kütüphanesi yüklenemedi. İnternetini kontrol et ya da aynı cihazda oyna.":"Online bağlantı hazırlanıyor…"}</p>`}
      ${errHtml()}
      <div style="border-top:1px solid var(--line);padding-top:12px" class="stack">
        <div><label for="localNames">Aynı cihazda · oyuncular (virgülle)</label><input id="localNames" placeholder="Ali, Ayşe, Can"></div>
        <div class="row"><button id="localBtn" class="ghost">Aynı cihazda başla</button></div>
      </div>
    </div>
  </div>
  <div class="card rules">
    <div class="rule"><span class="n">$20</span><div><b>Herkesin kasası 20 dolar</b><p>Para bitince mezat da biter.</p></div></div>
    <div class="rule"><span class="n">×10</span><div><b>10 eşya mezata çıkar</b><p>Fotoğraflı, tek tek, karışık sırayla.</p></div></div>
    <div class="rule"><span class="n">✉</span><div><b>Kapalı zarf teklif</b><p>En yüksek teklif alır, teklifi kadar öder. 0 = pas.</p></div></div>
    <div class="rule"><span class="n">★</span><div><b>En iyi kadro kazanır</b><p>Herkes en iyi kadroya oy verir.</p></div></div>
  </div>
  <div class="card stack"><h2>${THEMES.length} hazır tema</h2>${themeGrid(null,false)}</div></div>`;
  bind("createBtn",createRoom);bind("joinBtn",joinRoom);bind("localBtn",startLocal);
  const j=document.getElementById("joinCode");if(j)j.addEventListener("keydown",e=>{if(e.key==="Enter")joinRoom()});
}
function themeGrid(g,interactive){
  const sel=g?(g.custom?"custom":g.themeIdx||0):-1;
  const order=THEMES.map((T,i)=>i).sort((a,b)=>(THEMES[b].special?1:0)-(THEMES[a].special?1:0));
  const cards=order.map(i=>{const T=THEMES[i];return `<button class="th ${T.special?"special":""} ${sel===i?"sel":""}" data-theme="${i}" ${interactive?"":"disabled"} aria-pressed="${sel===i}">
     <div class="mosaic">${T.items.slice(0,4).map(x=>photo(x)).join("")}</div><span class="nm">${esc(T.name)}</span></button>`}).join("");
  const custom=interactive||sel==="custom"?`<button class="th custom ${sel==="custom"?"sel":""}" data-theme="custom" ${interactive?"":"disabled"}><div class="mosaic">+</div><span class="nm">${g&&g.custom?esc(g.custom.name):"Kendi temanı yaz"}</span></button>`:"";
  return `<div class="themes">${cards}${custom}</div>`;
}
function lobby(){
  const g=S.g,R=Object.keys(g.players).sort((a,b)=>g.players[a].order-g.players[b].order),host=isHost(),t=themeOf(g);
  const showCustom=host&&(g.custom||S.customOpen);
  app.innerHTML=`<div class="stack" style="gap:18px">
   <div class="hero" style="grid-template-columns:${S.mode==="online"?"auto 1fr":"1fr"}">
     ${S.mode==="online"?`<div class="card stack" style="align-items:flex-start"><label>Oda kodu</label><div class="bigcode">${esc(g.code)}</div>
       <button class="ghost" id="copyBtn">Kodu kopyala</button><p class="note" style="max-width:30ch">Arkadaşına bu sayfanın linkini ve kodu gönder.</p></div>`:""}
     <div class="card stack"><h2>Masadakiler <span class="tag">${R.length}/${MAXP}</span></h2>
       <div class="podiums">${R.map(id=>`<div class="pod ${id===S.myId&&S.mode==="online"?"me":""}"><div class="top">${avatar(g,id)}<span class="nm">${esc(pname(g,id))}</span></div><div class="cash">$${BUDGET}</div><span class="st">${id===g.host?"ev sahibi":"hazır"}</span></div>`).join("")}</div>
       ${R.length<2?`<p class="note">En az bir rakip bekleniyor…</p>`:""}</div>
   </div>
   <div class="card stack"><div class="row" style="justify-content:space-between"><h2>Tema: ${esc(t.name)}</h2>${host?"":`<span class="tag">ev sahibi seçiyor</span>`}</div>
     ${themeGrid(g,host&&!S.busy)}
     ${showCustom?`<div class="stack" style="border-top:1px solid var(--line);padding-top:14px">
       <div><label for="cName">Tema adı</label><input id="cName" maxlength="60" value="${esc(g.custom?g.custom.name:"")}" placeholder="ör. En iyi Türk dizisi"></div>
       <div><label for="cItems">${MINI}-${ITEMS} eşya, her satıra bir tane</label><textarea id="cItems" placeholder="Ezel&#10;Behzat Ç.&#10;…">${esc(g.custom?g.custom.items.join("\n"):"")}</textarea></div>
       <div class="row"><button class="ghost" id="saveCustom">Temayı kaydet</button><span class="note">Kendi temalarında fotoğraf yerine renkli kart çıkar.</span></div></div>`:""}
   </div>
   ${errHtml()}
   <div class="row">${host?`<button class="hot" id="startBtn" ${R.length>=2&&!S.busy&&t.items.length>=MINI?"":"disabled"}>${R.length<2?"En az 2 oyuncu gerekli":"Mezatı başlat"}</button>`:`<span class="note">Ev sahibinin başlatması bekleniyor…</span>`}
   <button class="ghost" id="leaveBtn">${S.mode==="local"?"Çık":"Odadan çık"}</button></div></div>`;
  bind("startBtn",startGame);bind("leaveBtn",()=>leave());
  bind("copyBtn",()=>{const b=document.getElementById("copyBtn");try{navigator.clipboard.writeText(g.code).then(()=>b.textContent="Kopyalandı",()=>b.textContent="Kod: "+g.code)}catch(e){b.textContent="Kod: "+g.code}});
  app.querySelectorAll("button.th:not(:disabled)").forEach(b=>b.addEventListener("click",()=>{
    const v=b.dataset.theme;if(v==="custom"){S.customOpen=true;render();return}
    S.customOpen=false;if(!g.custom&&(g.themeIdx||0)===Number(v))return;write({themeIdx:Number(v),custom:null})}));
  bind("saveCustom",()=>{const name=(document.getElementById("cName").value||"Kendi temam").trim().slice(0,60);
    const items=document.getElementById("cItems").value.split("\n").map(s=>s.trim().slice(0,60)).filter(Boolean);
    if(items.length<MINI){S.err=`En az ${MINI} eşya gerekiyor, şu an ${items.length} tane var.`;render();return}
    S.err="";write({custom:{name,items:items.slice(0,ITEMS)}})});
}
function podiums(g,L,b,showStatus){
  return `<div class="podiums">${roster(g).map(id=>{
    const st=!showStatus?"":L.cash[id]<=0?`<span class="st">parası bitti</span>`:b[id]!=null?`<span class="st ok">zarf verildi ✓</span>`:`<span class="st">düşünüyor…</span>`;
    return `<div class="pod ${id===S.myId&&S.mode==="online"?"me":""}"><div class="top">${avatar(g,id)}<span class="nm">${esc(pname(g,id))}</span></div>
      <div class="cash">$${L.cash[id]}</div><div class="meter"><i style="width:${L.cash[id]/BUDGET*100}%"></i></div>${st}
      ${L.won[id].length?`<div class="mini">${L.won[id].map(w=>photo(w.item)).join("")}</div>`:""}</div>`}).join("")}</div>`;
}
function creditLine(x){x=it(x);const c=x.img&&CREDITS[x.img];if(!c)return"";return `<a class="credit" href="${esc(c.src)}" target="_blank" rel="noopener">Foto: ${esc(c.author||"Wikimedia Commons")} · ${esc(c.license||"")}</a>`}
function bidding(){
  const g=S.g,r=g.idx,L=ledger(g,r),b=bidsOf(g,r),all=bidsIn(g,r,L.cash),R=roster(g),cur=it(g.items[r]);
  const dots=g.items.map((_,i)=>`<i class="${i<r?"done":i===r?"now":""}"></i>`).join("");
  let panel="",stamp="";
  if(!all){
    const who=myBidder();
    if(S.mode==="online"&&!R.includes(S.myId))panel=`<p class="note">İzliyorsun. Teklifler bekleniyor…</p>`;
    else if(!who||b[who]!=null)panel=`<div class="stack"><h3>Zarfın verildi</h3><div class="amount">$${b[S.myId]}</div><p class="note">Diğer teklifler bekleniyor…</p></div>`;
    else if(L.cash[who]<=0)panel=`<p class="note">Paran bitti, bu eşyayı izliyorsun.</p>`;
    else{const max=L.cash[who];S.bid=Math.min(S.bid,max);
      const chips=[0,1,2,3,5,8,max].filter((v,i,a)=>v<=max&&a.indexOf(v)===i);
      panel=`${S.mode==="local"?`<p style="margin:0;font-weight:800">Ekran <span style="color:var(--paddle)">${esc(pname(g,who))}</span>'da. Diğerleri baksın başka yere.</p>`:""}
        <div><label>Gizli teklifin · kasanda $${max}</label>
        <div class="stepper"><button class="ghost" id="minus" aria-label="Azalt">−</button><div class="amount" aria-live="polite">$${S.bid}</div><button class="ghost" id="plus" aria-label="Artır">+</button></div></div>
        <div class="chips">${chips.map(v=>`<button data-v="${v}" class="${S.bid===v?"on":""}">${v===0?"Pas":v===max?"Hepsi $"+v:"$"+v}</button>`).join("")}</div>
        <button class="hot" id="bidBtn" ${S.busy?"disabled":""}>${S.bid===0?"Pas geç":"$"+S.bid+" teklif ver"}</button>`;}
  }else{
    const res=resolve(g,r,L.cash);
    stamp=res.winner?`<div class="stamp">SATILDI · $${res.price}</div>`:`<div class="stamp burn">YANDI</div>`;
    const rows=R.map(id=>({id,a:b[id]==null?0:Math.min(b[id],L.cash[id])})).sort((x,y)=>y.a-x.a)
      .map(x=>`<div class="bidrow ${x.id===res.winner?"win":""}">${avatar(g,x.id)}<span class="nm">${esc(pname(g,x.id))}</span><b>${x.a?"$"+x.a:"pas"}</b></div>`).join("");
    panel=`<h3>${res.winner?esc(pname(g,res.winner))+" aldı!":"Kimse istemedi."}</h3>${rows}
      <p class="note">Eşitlikte kasasında daha çok para kalan alır, o da eşitse kura çekilir.</p>
      ${isHost()?`<button class="hot" id="nextBtn" ${S.busy?"disabled":""}>${r+1>=N(g)?"Sonuçlara geç":"Sıradaki eşya"}</button>`:`<span class="note">Ev sahibi sıradaki eşyayı açacak…</span>`}`;
  }
  const next=g.items[r+1]&&it(g.items[r+1]),nc=next&&next.img&&CREDITS[next.img];
  app.innerHTML=`<div class="stack" style="gap:16px">
    ${podiums(g,L,b,!all)}
    <div class="stage">
      <div class="stack" style="gap:10px">
        <div class="lot">${photo(cur)}${creditLine(cur)}${stamp}
          <div class="cap"><div class="no">EŞYA ${r+1}/${N(g)} · ${esc(g.themeName)}</div><div class="item">${esc(cur.t)}</div></div></div>
        <div class="dots">${dots}</div>
      </div>
      <div class="card panel">${panel}</div>
    </div>
    ${nc?`<link rel="prefetch" href="img/${esc(nc.file)}">`:""}
    ${S.stale?`<p class="note">Bağlantı yavaş, gördüğün durum güncel olmayabilir.</p>`:""}${errHtml()}
    <div class="row"><button class="ghost" id="leaveBtn">${S.mode==="local"?"Oyunu bitir":"Odadan çık"}</button></div></div>`;
  const setBid=v=>{S.bid=v;render()};
  bind("minus",()=>setBid(Math.max(0,S.bid-1)));bind("plus",()=>setBid(Math.min(L.cash[myBidder()]||0,S.bid+1)));
  app.querySelectorAll(".chips button").forEach(x=>x.addEventListener("click",()=>setBid(Number(x.dataset.v))));
  bind("bidBtn",submitBid);bind("nextBtn",nextItem);bind("leaveBtn",()=>leave());
}
function results(){
  const g=S.g,L=ledger(g,N(g)),R=roster(g),T=voteTally(g),V=votesOf(g),voted=Object.keys(V).length,allVoted=R.every(id=>V[id]);
  const maxV=Math.max(...R.map(id=>T[id]));const leaders=allVoted?R.filter(id=>T[id]===maxV&&maxV>0):[];
  const voter=myVoter(),canVoteFor=id=>voter&&(R.length<=2||id!==voter);
  const teams=R.map(id=>`<div class="team ${leaders.includes(id)||(g.judge&&g.judge.winner===id)?"top":""}">
     <div class="row" style="justify-content:space-between"><div class="row">${avatar(g,id)}<h3>${esc(pname(g,id))}</h3></div>${allVoted?`<span class="votes">${T[id]} oy</span>`:""}</div>
     ${L.won[id].length?`<div class="grid">${L.won[id].map(w=>`<div class="it">${photo(w.item)}<span>${esc(w.item.t)}</span><b>$${w.price}</b></div>`).join("")}</div>`:`<p class="note">Hiç eşya almadı.</p>`}
     <p class="note">Kalan para: $${L.cash[id]}</p>
     ${canVoteFor(id)?`<button class="ghost" data-vote="${id}" ${S.busy?"disabled":""}>Bu kadroya oy ver</button>`:""}</div>`).join("");
  const head=allVoted?(leaders.length===1?`${esc(pname(g,leaders[0]))} kazandı!`:leaders.length>1?`Berabere: ${leaders.map(id=>esc(pname(g,id))).join(", ")}`:"Kimse oy almadı"):"Kadrolar hazır. Oylama!";
  const voteMsg=allVoted?"":voter?(S.mode==="local"?`Oy sırası: <b>${esc(pname(g,voter))}</b>${R.length>2?" (kendine oy veremezsin)":""}`:`En iyi kadroya oy ver${R.length>2?" (kendine oy veremezsin)":""}.`):`Oylar bekleniyor (${voted}/${R.length})…`;
  app.innerHTML=`<div class="stack" style="gap:18px">
    <div><div class="tag">${esc(g.themeName)}</div><h2 style="font-size:clamp(30px,6vw,48px)">${head}</h2>${voteMsg?`<p class="note" style="margin-top:6px">${voteMsg}</p>`:""}</div>
    <div class="teams">${teams}</div>
    ${errHtml()}
    <div class="row">${isHost()?`<button class="hot" id="againBtn" ${S.busy?"disabled":""}>Yeni mezat</button>`:""}<button class="ghost" id="leaveBtn">Ana sayfa</button></div></div>`;
  app.querySelectorAll("[data-vote]").forEach(x=>x.addEventListener("click",()=>castVote(x.dataset.vote)));
  bind("judgeBtn",askJudge);bind("againBtn",rematch);bind("leaveBtn",()=>leave());
}
document.getElementById("credits").innerHTML=THEMES.flatMap(T=>T.items.filter(x=>x.img&&CREDITS[x.img]).map(x=>{const c=CREDITS[x.img];
  return `<li>${esc(x.t)}: <a href="${esc(c.src)}" target="_blank" rel="noopener">${esc(c.author||"Wikimedia Commons")}</a>, ${esc(c.license)}</li>`})).join("");

// ---------- başlangıç ----------
S.myId=pid();S.db=(typeof Peer!=="undefined")?{}:null;
(()=>{const code=ls.get("m20-room");if(!code||!S.db)return;
  let saved=null;try{saved=JSON.parse(ls.get("m20-host-"+code)||"null")}catch(e){}
  if(saved&&saved.host===S.myId)hostOpen(code,saved);
  else if(ls.get("m20-room-name"))clientOpen(code,ls.get("m20-room-name"));})();
render();
</script>
